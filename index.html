<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fintech App Replica</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* 9:16 Mobile Container constraint for desktop viewing */
        .mobile-container {
            width: 100%;
            height: 100dvh;
            background: linear-gradient(180deg, #4b29ad 0%, #1c0a40 40%, #000000 70%);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        @media (min-width: 450px) {
            .mobile-container {
                width: 390px;
                height: 844px; /* standard iOS proportion */
                border-radius: 45px;
                border: 12px solid #111;
                box-shadow: 0 0 50px rgba(75, 41, 173, 0.2);
            }
        }

        /* iOS Toast Notification Styling */
        #notification-toast {
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease;
            transform: translateY(-150%); /* Off-screen initially */
            opacity: 0;
        }

        #notification-toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* Balance update animation */
        .balance-update-anim {
            animation: pulse-balance 0.5s ease-out forwards;
        }

        @keyframes pulse-balance {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.08); opacity: 1; text-shadow: 0 0 20px rgba(255,255,255,0.5); }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="text-white antialiased selection:bg-[#4b29ad] selection:text-white">

    <div class="mobile-container">
        
        <!-- iOS Style Notification Toast (Hidden initially) -->
        <div id="notification-toast" class="absolute top-4 sm:top-8 left-1/2 -translate-x-1/2 w-[90%] max-w-[350px] z-50 rounded-2xl bg-white/15 backdrop-blur-xl border border-white/20 shadow-2xl overflow-hidden p-3.5 flex gap-3 items-center">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-green-400 to-emerald-600 flex items-center justify-center flex-shrink-0 shadow-inner">
                <i class="fa-solid fa-arrow-down text-white text-lg"></i>
            </div>
            <div class="flex-1 min-w-0">
                <div class="flex justify-between items-baseline mb-0.5">
                    <span class="text-white/90 text-sm font-semibold tracking-wide">Wallet</span>
                    <span class="text-white/50 text-xs">now</span>
                </div>
                <p class="text-white text-[13px] font-medium truncate leading-tight">
                    Transfer Received: €3,371.90
                </p>
            </div>
        </div>

        <header class="flex justify-between items-center px-6 pt-14 pb-2 gap-4 w-full z-10 relative">
            <!-- Profile Picture -->
            <div class="w-9 h-9 rounded-full overflow-hidden flex-shrink-0 bg-white/20 border border-white/10">
                <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=100&h=100&fit=crop" alt="Profile" class="w-full h-full object-cover">
            </div>
            
            <!-- Search Bar Pill -->
            <div class="flex-1 bg-white/15 hover:bg-white/25 transition-colors backdrop-blur-md rounded-full h-9 flex items-center px-4 cursor-pointer border border-white/5">
                <i class="fa-solid fa-magnifying-glass text-white/70 text-sm"></i>
            </div>
            
            <!-- Action Icons -->
            <div class="flex gap-2.5 flex-shrink-0">
                <button class="w-9 h-9 rounded-full bg-white/15 hover:bg-white/25 transition-colors backdrop-blur-md flex items-center justify-center border border-white/5">
                    <i class="fa-solid fa-chart-simple text-white text-sm"></i>
                </button>
                <button class="w-9 h-9 rounded-full bg-white/15 hover:bg-white/25 transition-colors backdrop-blur-md flex items-center justify-center border border-white/5">
                    <i class="fa-solid fa-credit-card text-white text-sm"></i>
                </button>
            </div>
        </header>

        <main class="flex-1 flex flex-col items-center mt-10 px-6 z-10 relative">
            <span class="text-white/80 text-[15px] font-medium tracking-wide">Bills</span>
            
            <!-- Central Balance Display -->
            <div id="main-balance-container" class="my-2">
                <div id="main-balance" class="text-[4rem] leading-[4.5rem] font-bold text-white tracking-tight flex items-baseline justify-center drop-shadow-lg">
                    €0<span class="text-[2.3rem]">.00</span>
                </div>
            </div>
            
            <!-- Accounts Pill Button -->
            <button class="bg-white/15 hover:bg-white/25 transition-colors backdrop-blur-md border border-white/10 text-white px-7 py-2.5 rounded-full text-sm font-medium mt-1">
                Accounts
            </button>
        </main>

        <div class="flex justify-between items-center px-8 mb-8 w-full z-10 relative">
            <!-- Add Money -->
            <div class="flex flex-col items-center gap-2.5 cursor-pointer group">
                <div class="w-14 h-14 bg-[#18181b] group-hover:bg-[#27272a] border border-white/5 transition-all duration-300 rounded-full flex items-center justify-center group-hover:scale-105">
                    <i class="fa-solid fa-plus text-white text-[22px]"></i>
                </div>
                <span class="text-white/90 text-[13px] font-medium">Add money</span>
            </div>
            
            <!-- Withdraw -->
            <div class="flex flex-col items-center gap-2.5 cursor-pointer group">
                <div class="w-14 h-14 bg-[#18181b] group-hover:bg-[#27272a] border border-white/5 transition-all duration-300 rounded-full flex items-center justify-center group-hover:scale-105">
                    <i class="fa-solid fa-arrow-down text-white text-[20px]"></i>
                </div>
                <span class="text-white/90 text-[13px] font-medium">Withdraw</span>
            </div>
            
            <!-- Info -->
            <div class="flex flex-col items-center gap-2.5 cursor-pointer group">
                <div class="w-14 h-14 bg-[#18181b] group-hover:bg-[#27272a] border border-white/5 transition-all duration-300 rounded-full flex items-center justify-center group-hover:scale-105">
                    <i class="fa-solid fa-info text-white text-[20px]"></i>
                </div>
                <span class="text-white/90 text-[13px] font-medium">Info</span>
            </div>
            
            <!-- More -->
            <div class="flex flex-col items-center gap-2.5 cursor-pointer group">
                <div class="w-14 h-14 bg-[#18181b] group-hover:bg-[#27272a] border border-white/5 transition-all duration-300 rounded-full flex items-center justify-center group-hover:scale-105">
                    <i class="fa-solid fa-ellipsis text-white text-[20px]"></i>
                </div>
                <span class="text-white/90 text-[13px] font-medium">More</span>
            </div>
        </div>

        <div class="bg-[#1a1a1a] w-full rounded-t-[32px] px-6 pt-8 pb-10 flex flex-col gap-6 z-20 relative shadow-[0_-15px_40px_rgba(0,0,0,0.6)] border-t border-white/5 flex-1 max-h-[35%] overflow-y-auto no-scrollbar">
            
            <!-- Transaction 1: House Bills -->
            <div class="flex items-center justify-between group cursor-pointer">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-full bg-[#c99a83] flex items-center justify-center flex-shrink-0">
                        <i class="fa-solid fa-house text-white text-lg"></i>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-white text-[16px] font-semibold tracking-wide">House bills</span>
                        <span class="text-white/50 text-[13px] mt-0.5">14:35</span>
                    </div>
                </div>
                <span class="text-white text-[16px] tracking-wide font-medium">-€634</span>
            </div>
            
            <!-- Transaction 2: Gym Subscription -->
            <div class="flex items-center justify-between group cursor-pointer">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-full bg-[#20c49d] flex items-center justify-center flex-shrink-0">
                        <i class="fa-solid fa-dumbbell text-white text-lg"></i>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-white text-[16px] font-semibold tracking-wide">Gym subscription</span>
                        <span class="text-white/50 text-[13px] mt-0.5">10:20</span>
                    </div>
                </div>
                <span class="text-white text-[16px] tracking-wide font-medium">-€29.99</span>
            </div>

            <!-- See All Button -->
            <button class="w-full text-center text-white/70 hover:text-white transition-colors text-[15px] font-medium mt-3 py-2">
                See all
            </button>
            
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toast = document.getElementById('notification-toast');
            const balanceElement = document.getElementById('main-balance');
            
            // Timeline execution
            
            // 1. Slide down notification at exactly 7 seconds (7000ms)
            setTimeout(() => {
                toast.classList.add('show');
                // Optional: Play a tiny vibration if supported by the browser on mobile
                if(navigator.vibrate) navigator.vibrate(50);
            }, 7000);

            // 2. Dynamically update the main balance at exactly 10 seconds (10000ms)
            setTimeout(() => {
                // Update text maintaining the size ratio
                balanceElement.innerHTML = '€3,371<span class="text-[2.3rem]">.90</span>';
                
                // Trigger the CSS animation for a smooth pop effect
                balanceElement.classList.remove('balance-update-anim'); // reset just in case
                void balanceElement.offsetWidth; // trigger reflow
                balanceElement.classList.add('balance-update-anim');
            }, 10000);

            // 3. Slide up notification back out of view at 11 seconds (11000ms)
            setTimeout(() => {
                toast.classList.remove('show');
            }, 11000);
        });
    </script>
</body>
</html>
